[project]
name = "susurro"
version = "0.1.0"
description = "Local, fully-offline voice dictation for Linux/Wayland (Phase 1 smoke harness)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    # CUDA/cuDNN owned by the venv, isolated from Arch's system CUDA (see plan Decisions).
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]

[project.scripts]
susurro = "susurro.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/susurro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
