[project]
name = "susurro"
version = "0.1.0"
description = "Local, fully-offline voice dictation for Linux/Wayland/Hyprland"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    # CUDA/cuDNN owned by the venv, isolated from Arch's system CUDA (see plan Decisions).
    "nvidia-cublas-cu12>=12.4",
    "nvidia-cudnn-cu12>=9.1",
]

[project.scripts]
susurro = "susurro.__main__:main"
susurro-daemon = "susurro.daemon:main"
susurro-ctl = "susurro.ctl:main"
susurro-bench = "susurro.bench.cli:main"

# The benchmark's extra runtimes live here, NOT in core `dependencies`: the daemon's
# footprint and CUDA/CTranslate2 ABI stay untouched. Install with `uv sync --extra bench`.
# jiwer (WER/CER scoring) and the optional whisper.cpp runtime (pywhispercpp) live here.
[project.optional-dependencies]
bench = [
    "jiwer>=3",
]
# Heavy runtimes are split into their own extras so `bench` (scoring + faster-whisper,
# which is a core dep) stays light. Install a backend only when you want to benchmark
# it: `uv sync --extra bench --extra bench-whispercpp`.
bench-whispercpp = [
    "pywhispercpp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/susurro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The code targets ~100 cols (deliberate multi-line signatures); pin the formatter
# to match so `ruff format` doesn't rewrap them to its 88-col default. Only affects
# formatting — the default lint rule set (no E501) is unchanged.
line-length = 100
